# Immich v3.3.5 with its Postgres (VectorChord) and Valkey; machine learning is off, so its container is left out.
# Postgres and Valkey are the digests Immich's own docker/docker-compose.yml pins at v3.3.5.
services:
  immich-server:
    # ghcr.io/immich-app/immich-server:v3.3.5
    image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:12283:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "immich-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  redis:
    # docker.io/valkey/valkey:9
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      interval: 2s
      timeout: 3s
      retries: 30

  database:
    # ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    shm_size: 128mb
    healthcheck:
      test: pg_isready -U postgres -d immich
      interval: 2s
      timeout: 3s
      retries: 60
