name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run check

  test:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The Postgres leg is part of the self-test, not an extra: without it the SQL-only defects and
    # every engine difference go untested, and the suite fails rather than skip it silently.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: runner
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test:unit
      # A fresh seed per run, printed in the output, so the combination pass explores new ground
      # and any failure it finds replays exactly.
      - name: Conformance
        run: node --experimental-sqlite dist/cli.js conformance --fuzz-seed ${{ github.run_id }}
      - name: Precision
        run: node --experimental-sqlite dist/cli.js conformance --precision 20 --seed ${{ github.run_id }}
      - name: CLI smoke
        run: |
          node dist/cli.js help
          # annotated spec has roots and missing tags — doctor exit 1 is advisory/blocking, not a crash
          set +e
          node dist/cli.js doctor --spec labs/annotated-openapi.yaml
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "doctor exited $code"
            exit "$code"
          fi
          node dist/cli.js plan --spec labs/annotated-openapi.yaml --json > /tmp/oat-plan.json
