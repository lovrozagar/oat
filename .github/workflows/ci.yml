name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run check

  # Three jobs side by side; they share only the checkout and the install. Timeouts are about 1.5
  # times what each took on d58aae1: build + unit 2m23s, conformance 36m06s, precision 47s.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test:unit
      - name: CLI smoke
        run: |
          node dist/cli.js help
          # annotated spec has roots and missing tags — doctor exit 1 is advisory/blocking, not a crash
          set +e
          node dist/cli.js doctor --spec labs/annotated-openapi.yaml
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "doctor exited $code"
            exit "$code"
          fi
          node dist/cli.js plan --spec labs/annotated-openapi.yaml --json > /tmp/oat-plan.json

  # The lowest Node that package.json's engines claims, pinned: "22" in the other jobs resolves to the
  # newest 22.x, so only this job proves the floor itself. It moves with src/errors/node-floor.ts.
  floor:
    name: node floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test:unit
      - name: sqlite conformance
        run: node dist/cli.js conformance --backend sqlite --legs passes

  # Servers, the CLI end to end, the goldens and the structure tests. Full history: the coverage
  # floors guard compares against the last committed floors that differ from the tree's.
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test:integration

  test:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # The Postgres leg is part of the self-test, not an extra: without it the SQL-only defects and
    # every engine difference go untested, and the suite fails rather than skip it silently.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17 # the official image; Docker Hub and ECR Public run out of anonymous quota
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: runner
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # A fresh seed per run, printed in the output, so the combination pass explores new ground
      # and any failure it finds replays exactly.
      - name: Conformance
        run: node dist/cli.js conformance --fuzz-seed ${{ github.run_id }}

  precision:
    name: precision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Varies the data against a correct backend (memory): any finding is a false positive.
      - name: Precision
        run: node dist/cli.js conformance --precision 20 --seed ${{ github.run_id }}
