name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - run: npm install -g npm@latest
      - name: Show OIDC and npm versions
        run: |
          npm --version
          node --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && echo "OIDC request URL is set" || echo "OIDC request URL is missing"
      - name: Publish to npm
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if npm view "@lovrozagar/oat@$tag" version >/dev/null 2>&1; then
            echo "npm already has @lovrozagar/oat@$tag — skipping publish"
          else
            npm publish --access public
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME#v}"
          fi
